<title>Rahath Chicken Suppliers</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#c2410c; --brand-600:#9a3412; --brand-50:#fff7ed; --brand-100:#ffedd5;
  --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --bg:#f4f5f7;
  --good:#15803d; --bad:#b91c1c;
  --bs-body-font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bs-primary:#c2410c; --bs-primary-rgb:194,65,12; --bs-link-color:#c2410c; --bs-link-color-rgb:194,65,12;
}
body{background:var(--bg);color:var(--ink);font-size:.94rem;-webkit-tap-highlight-color:transparent}
.text-good{color:var(--good)!important}.text-bad{color:var(--bad)!important}
.btn-brand{background:var(--brand);color:#fff;border:0;font-weight:600}
.btn-brand:hover,.btn-brand:focus,.btn-brand:active{background:var(--brand-600)!important;color:#fff!important}
.btn-soft{background:var(--brand-50);color:var(--brand-600);border:0;font-weight:600}
.btn-soft:hover{background:var(--brand-100);color:var(--brand-600)}
.form-control,.form-select{border-radius:10px;padding:.6rem .8rem;font-size:16px}
.form-control:focus,.form-select:focus{border-color:#fb923c;box-shadow:0 0 0 .2rem rgba(234,88,12,.15)}
.form-label{font-size:.8rem;font-weight:600;color:#4b5563;margin-bottom:.3rem}
.form-check-input:checked{background-color:var(--brand);border-color:var(--brand)}

/* Login */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 20% 10%,#fed7aa 0,transparent 40%),radial-gradient(circle at 90% 90%,#fde68a 0,transparent 35%),var(--bg)}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:22px;padding:28px;box-shadow:0 20px 50px rgba(124,45,18,.12)}
.logo{width:84px;height:84px;flex-shrink:0;border-radius:50%;filter:drop-shadow(0 4px 10px rgba(30,41,82,.25))}
.logo.sm{width:42px;height:42px;filter:none}

/* Shell */
.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;z-index:1030;display:none}
.sidebar .grp{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af;font-weight:700;padding:16px 20px 6px}
.sidebar a{display:flex;align-items:center;gap:12px;padding:9px 14px;margin:1px 10px;border-radius:10px;color:#374151;text-decoration:none;font-weight:500}
.sidebar a:hover{background:#f3f4f6}
.sidebar a.active{background:var(--brand-50);color:var(--brand-600);font-weight:600}
.sidebar a i{font-size:1.05rem}
.main{min-height:100vh;padding-bottom:90px}
.topbar{position:sticky;top:0;z-index:1020;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.content{padding:16px;max-width:1280px;margin:0 auto}
@media(min-width:992px){.sidebar{display:block}.main{margin-left:250px;padding-bottom:30px}.content{padding:24px 28px}.bottom-nav,.fab{display:none!important}}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:1030;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:#6b7280;text-decoration:none;padding:4px 0;font-weight:500}
.bottom-nav a i{font-size:1.25rem}
.bottom-nav a.active{color:var(--brand)}
.fab{position:fixed;right:16px;bottom:82px;z-index:1025;width:56px;height:56px;border-radius:18px;background:var(--brand);color:#fff;border:0;font-size:1.6rem;box-shadow:0 10px 24px rgba(194,65,12,.35)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-100);color:var(--brand-600);display:grid;place-items:center;font-weight:700;font-size:.85rem}

/* Content pieces */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.page-head h1{font-size:1.35rem;font-weight:700;margin:0}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.cardx{background:#fff;border-radius:16px;border:1px solid var(--line)}
.stat{background:#fff;border-radius:14px;border:1px solid var(--line);padding:12px 14px;height:100%}
.stat .lbl{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.stat .val{font-size:1.2rem;font-weight:700;margin-top:2px;white-space:nowrap}
.stat .sub{font-size:.78rem;color:var(--muted)}
.stat.hero{background:linear-gradient(135deg,var(--brand),#ea580c);color:#fff;border:0}
.stat.hero .lbl,.stat.hero .sub{color:rgba(255,255,255,.85)}
.ico{width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;background:var(--brand-50);color:var(--brand)}
.date-nav{display:flex;gap:6px;align-items:center;margin-bottom:14px}
.date-nav input{max-width:180px;background:#fff}
.date-nav .btn-light{background:#fff;border:1px solid var(--line);border-radius:10px;height:44px;width:44px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:14px}
.filters .form-control,.filters .form-select{background:#fff;max-width:190px}
.table{margin:0;font-size:.88rem}
.table thead th{background:#f9fafb;color:#6b7280;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;padding:.7rem .75rem}
.table td{padding:.65rem .75rem;border-color:#f1f2f4;white-space:nowrap}
.table tfoot td{background:#fffbf5;font-weight:700;border-top:2px solid var(--brand-100)}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.m-card{background:#fff;border-radius:14px;border:1px solid var(--line);padding:12px 14px}
.m-card .m-title{font-weight:600}
.m-card .m-sub{font-size:.78rem;color:var(--muted)}
.m-card .m-amt{font-weight:700;font-size:1.05rem;text-align:right;white-space:nowrap}
.m-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.m-grid span{display:block;font-size:.66rem;color:#9ca3af;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.m-grid b{font-weight:600;font-size:.86rem;word-break:break-word}
.m-actions{display:flex;gap:8px;margin-top:10px}
.m-actions .btn{flex:1}
.m-total{background:#fffbf5;border-color:var(--brand-100)}
.icon-btn{border:0;background:transparent;width:32px;height:32px;border-radius:8px;color:#6b7280}
.icon-btn:hover{background:#f3f4f6;color:var(--ink)}
.icon-btn.del:hover{background:#fee2e2;color:var(--bad)}
.badge-soft{font-weight:600;padding:.35em .6em;border-radius:6px;font-size:.72rem}
.b-in{background:#dcfce7;color:#166534}.b-out{background:#fee2e2;color:#991b1b}.b-gray{background:#f3f4f6;color:#374151}.b-brand{background:var(--brand-100);color:var(--brand-600)}.b-amber{background:#fef3c7;color:#92400e}
.empty{text-align:center;padding:40px 16px;color:var(--muted);background:#fff;border:1px dashed #d1d5db;border-radius:16px}
.empty i{font-size:2rem;display:block;margin-bottom:6px;color:#d1d5db}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--brand-50);border-radius:12px;padding:12px;margin-top:16px}
.calc-4{grid-template-columns:repeat(4,1fr)}@media(max-width:575.98px){.calc-4{grid-template-columns:repeat(2,1fr)}}
.calc span{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--brand-600);font-weight:700}
.calc b{font-size:1.05rem}
.pl-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f2f4}
.pl-row:last-child{border-bottom:0}
.pl-row.total{font-weight:700;font-size:1.05rem;border-top:2px solid var(--ink);border-bottom:0;margin-top:4px}
.pl-row.sub{font-weight:600;background:#f9fafb;margin:0 -16px;padding:10px 16px}
.bars{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.bars .bar{width:100%;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.bars .bar.neg{background:var(--bad)}
.bars .b small{font-size:.62rem;color:#9ca3af}
.quick a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;background:#fff;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.8rem;text-align:center}
.quick a i{font-size:1.4rem;color:var(--brand)}
.seg .btn{border-radius:10px!important;font-weight:600}
.btn-check:checked+.btn-outline-out{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.btn-check:checked+.btn-outline-in{background:#dcfce7;color:#166534;border-color:#86efac}
.btn-outline-out,.btn-outline-in{border:1px solid var(--line);background:#fff}
.modal-content{border-radius:18px;border:0}
.offcanvas .list-group-item{border:0;padding:12px 16px;display:flex;gap:12px;align-items:center;font-weight:500}
.offcanvas .list-group-item.active{background:var(--brand-50);color:var(--brand-600)}
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:2000}
@media(min-width:992px){.toast-wrap{bottom:24px}}
.note{background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:12px;padding:10px 12px;font-size:.82rem}
.form-page{max-width:780px}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
@media(max-width:991.98px){.form-actions{position:fixed;left:0;right:0;bottom:0;z-index:1030;margin:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}.form-actions .btn{flex:1;padding:.7rem}}
.invalid-feedback{font-size:.78rem;font-weight:500}
.radio-group+.invalid-feedback{display:block}
a.link{color:var(--brand-600);text-decoration:none;font-weight:600}
.searchbox{position:relative;max-width:320px;flex:1}
.searchbox i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9ca3af}
.searchbox{min-width:240px}.filters .searchbox .form-control{padding-left:36px;background:#fff;max-width:none}
</style>
</head>

<!-- ============ LOGIN ============ -->
<div id="loginView">
  <div class="login-card">
    <div class="d-flex align-items-center gap-3 mb-4">
      <img class="logo" data-logo alt="Rahath Chicken">
      <div>
        <div class="fw-bold fs-5 lh-sm">Rahath Chicken</div>
        <div class="text-muted small">Suppliers · Wholesale Manager</div>
      </div>
    </div>
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input class="form-control" name="u" autocomplete="username" placeholder="e.g. rahath">
      </div>
      <div class="mb-2">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="p" autocomplete="current-password" placeholder="••••">
      </div>
      <div id="loginErr" class="text-danger small mb-2" style="min-height:18px"></div>
      <button class="btn btn-brand w-100 py-2">Sign in</button>
    </form>
    <div class="text-center text-muted small my-3">— Demo quick login —</div>
    <div class="d-grid gap-2">
      <button class="btn btn-soft py-2" data-action="demo-login" data-u="rahath"><i class="bi bi-person-badge me-1"></i> Owner · rahath</button>
      <button class="btn btn-light border py-2" data-action="demo-login" data-u="salim"><i class="bi bi-person me-1"></i> Employee · salim</button>
    </div>
    <div class="text-muted text-center mt-3" style="font-size:.75rem">Demo password for all users: <b>1234</b></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appView" class="d-none">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div class="d-flex align-items-center gap-2 px-3 px-lg-4 py-2" style="min-height:58px">
        <img class="logo sm d-lg-none" data-logo alt="Rahath Chicken">
        <div class="flex-grow-1 min-w-0">
          <div class="fw-bold text-truncate" id="topTitle">Dashboard</div>
          <div class="text-muted d-none d-sm-block" style="font-size:.75rem" id="topDate"></div>
        </div>
        <div class="dropdown">
          <button class="btn p-0 d-flex align-items-center gap-2" data-bs-toggle="dropdown">
            <span class="text-end d-none d-md-block lh-sm"><span class="fw-semibold small d-block" id="uName"></span><span class="text-muted" style="font-size:.72rem" id="uRole"></span></span>
            <span class="avatar" id="uAvatar"></span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow border-0" style="border-radius:12px">
            <li><span class="dropdown-item-text small text-muted" id="uMenuInfo"></span></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#" data-action="switch-role"><i class="bi bi-arrow-left-right me-2"></i>Switch demo role</a></li>
            <li><a class="dropdown-item text-danger" href="#" data-action="logout"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
          </ul>
        </div>
      </div>
    </header>
    <main class="content" id="page"></main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>
  <button class="fab d-none" id="fab"><i class="bi bi-plus-lg"></i></button>
</div>

<!-- More menu (mobile) -->
<div class="offcanvas offcanvas-bottom" tabindex="-1" id="moreMenu" style="height:auto;max-height:85vh;border-radius:20px 20px 0 0">
  <div class="offcanvas-header pb-0"><h6 class="offcanvas-title fw-bold">All screens</h6><button class="btn-close" data-bs-dismiss="offcanvas"></button></div>
  <div class="offcanvas-body pt-2" id="moreBody"></div>
</div>

<!-- Confirm modal -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content p-2">
      <div class="modal-body text-center">
        <div class="mb-2" style="font-size:2rem;color:var(--bad)"><i class="bi bi-trash3"></i></div>
        <div class="fw-bold mb-1">Delete this entry?</div>
        <div class="text-muted small" id="confirmText">This cannot be undone.</div>
      </div>
      <div class="d-flex gap-2 px-3 pb-3">
        <button class="btn btn-light border flex-fill" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger flex-fill" id="confirmYes">Delete</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-wrap"><div class="toast align-items-center text-bg-dark border-0" id="toast" role="status"><div class="d-flex"><div class="toast-body" id="toastBody"></div></div></div></div>

/* ---------------- Calculations ---------------- */
const partyList = t => t === 'supplier' ? DB.suppliers : DB.customers;
const partyName = (t, id) => (partyList(t).find(p => p.id === id) || {}).name || '—';
const monthOf = d => d.slice(0, 7);

function stockMap() {
  const all = [...DB.purchases, ...DB.sales].map(x => x.date).sort();
  const m = {}; if (!all.length) return m;
  let open = 0, openVal = 0, lastCpb = 0;
  for (let d = all[0]; d <= TODAY; d = addDays(d, 1)) {
    const P = DB.purchases.filter(x => x.date === d), S = DB.sales.filter(x => x.date === d);
    const pB = sum(P, x => x.birds), pKg = sum(P, netKg), pAmt = sum(P, amtOf);
    const sB = sum(S, x => x.birds), sKg = sum(S, netKg), sAmt = sum(S, amtOf);
    const dead = sum(DB.journal.filter(j => j.date === d && j.type === 'in'), j => j.birds);
    const cpb = (open + pB) > 0 ? (openVal + pAmt) / (open + pB) : lastCpb;
    if (cpb) lastCpb = cpb;
    const close = open + pB - sB - dead;
    m[d] = {open, pB, pKg, pAmt, sB, sKg, sAmt, dead, close, cpb, cogs: sB * cpb, deadCost: dead * cpb, closeVal: close * cpb, avgW: pB ? pKg / pB : 0};
    open = close; openVal = close * cpb;
  }
  return m;
}
function dayPL(d, sm) {
  const s = sm[d] || {pB: 0, pKg: 0, pAmt: 0, sB: 0, sKg: 0, sAmt: 0, dead: 0, cogs: 0, deadCost: 0, close: 0, cpb: 0};
  const exps = DB.expenses.filter(e => e.date === d);
  const exp = sum(exps, e => e.amount);
  const jIn = sum(DB.journal.filter(j => j.date === d && j.type === 'in'), j => j.amount);
  const jOut = sum(DB.journal.filter(j => j.date === d && j.type === 'out'), j => j.amount);
  const gross = s.sAmt - s.cogs;
  return {...s, exps, exp, jIn, jOut, gross, net: gross + jIn - jOut - s.deadCost - exp};
}
function partyBalance(t, id, upto = TODAY) {
  const p = partyList(t).find(x => x.id === id); if (!p) return 0;
  const tx = t === 'supplier' ? DB.purchases : DB.sales;
  const bills = sum(tx.filter(x => x.partyId === id && x.date <= upto), amtOf);
  const paid = sum(DB.payments.filter(x => x.partyType === t && x.partyId === id && x.date <= upto), x => x.amount);
  const disc = sum(DB.journal.filter(x => x.partyType === t && x.partyId === id && x.date <= upto), x => x.amount);
  return p.opening + bills - paid - disc;
}
function ledger(t, id) {
  const tx = t === 'supplier' ? DB.purchases : DB.sales, rows = [];
  tx.filter(x => x.partyId === id).forEach(x => rows.push({date: x.date, kind: t === 'supplier' ? 'Purchase' : 'Sale', desc: `${num(x.birds, 0)} birds · ${num(netKg(x))} kg @ ${inr(x.rate, 2)}` + (x.narration ? ' · ' + x.narration : ''), add: amtOf(x), less: 0}));
  DB.payments.filter(x => x.partyType === t && x.partyId === id).forEach(x => rows.push({date: x.date, kind: t === 'supplier' ? 'Payment' : 'Receipt', desc: x.mode + (x.note ? ' · ' + x.note : ''), add: 0, less: x.amount}));
  DB.journal.filter(x => x.partyType === t && x.partyId === id).forEach(x => rows.push({date: x.date, kind: x.type === 'in' ? 'Discount In' : 'Discount Out', desc: x.reason + (x.birds ? ` · ${x.birds} birds` : '') + (x.note ? ' · ' + x.note : ''), add: 0, less: x.amount}));
  const order = {Purchase: 0, Sale: 0, 'Discount In': 1, 'Discount Out': 1, Payment: 2, Receipt: 2};
  return rows.sort((a, b) => a.date.localeCompare(b.date) || order[a.kind] - order[b.kind]);
}

PAGES.statement = () => {
  const {type: t, id, from, to} = state.stmt, isS = t === 'supplier';
  const p = partyList(t).find(x => x.id === id);
  const all = ledger(t, id);
  let open = p.opening + sum(all.filter(r => r.date < from), r => r.add - r.less);
  let bal = open;
  const rows = all.filter(r => r.date >= from && r.date <= to).map(r => ({...r, bal: (bal += r.add - r.less)}));
  const tAdd = sum(rows, r => r.add), tLess = sum(rows, r => r.less);
  const kindBadge = k => `<span class="badge-soft ${/Purchase|Sale/.test(k) ? 'b-brand' : /Discount/.test(k) ? 'b-amber' : 'b-in'}">${k}</span>`;
  const cols = [
    {h: 'Date', card: 'title', v: r => `<span class="fw-semibold">${dShort(r.date)}</span> <span class="d-md-none">${kindBadge(r.kind)}</span>`},
    {h: 'Type', tableOnly: true, v: r => kindBadge(r.kind)},
    {h: 'Particulars', card: 'sub', v: r => esc(r.desc)},
    {h: isS ? 'Credit (bill)' : 'Debit (bill)', mh: 'Bill', end: 1, v: r => r.add ? inr(r.add) : '—', tf: inr(tAdd)},
    {h: isS ? 'Debit (paid/disc.)' : 'Credit (recd/disc.)', mh: isS ? 'Paid/Disc' : 'Recd/Disc', end: 1, v: r => r.less ? inr(r.less) : '—', tf: inr(tLess)},
    {h: 'Balance', card: 'amount', end: 1, v: r => `<b>${inr(r.bal)}</b>`, tf: inr(bal)},
  ];
  const parties = partyList(t).map(x => `<option value="${x.id}" ${x.id === id ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  const msg = `${p.name} – Statement ${dShort(from)} to ${dShort(to)}\nOpening: ${inr(open)}\n${isS ? 'Purchases' : 'Sales'}: ${inr(tAdd)}\n${isS ? 'Paid' : 'Received'} / discount: ${inr(tLess)}\nClosing ${isS ? 'payable' : 'due'}: ${inr(bal)}\n— Rahath Chicken Suppliers`;
  return `<a href="#${isS ? 'suppliers' : 'customers'}" data-nav="${isS ? 'suppliers' : 'customers'}" class="link small d-inline-block mb-2"><i class="bi bi-arrow-left"></i> ${isS ? 'Suppliers' : 'Customers'}</a>`
    + head(esc(p.name), `${esc(p.place)} · ${esc(p.phone)}`, `<a class="btn btn-light border d-none d-md-inline-flex align-items-center gap-1" target="_blank" rel="noopener" href="https://wa.me/91${p.phone}?text=${encodeURIComponent(msg)}"><i class="bi bi-whatsapp text-success"></i>Share</a><button class="btn btn-brand d-none d-md-inline-flex" data-action="pay" data-type="${t}" data-id="${id}"><i class="bi bi-cash me-1"></i>${isS ? 'Pay supplier' : 'Receive payment'}</button>`)
    + `<div class="filters"><div style="flex:1;min-width:200px;max-width:300px"><label class="form-label">${isS ? 'Supplier' : 'Customer'}</label><select class="form-select" data-stmt="id" style="max-width:none">${parties}</select></div>
       <div><label class="form-label">From</label><input type="date" class="form-control" data-stmt="from" value="${from}" max="${TODAY}"></div>
       <div><label class="form-label">To</label><input type="date" class="form-control" data-stmt="to" value="${to}" max="${TODAY}"></div></div>`
    + `<div class="row g-2 mb-3">
       <div class="col-6 col-md-3">${stat('Opening', inr(open), dShort(from))}</div>
       <div class="col-6 col-md-3">${stat(isS ? 'Purchases' : 'Sales', inr(tAdd))}</div>
       <div class="col-6 col-md-3">${stat(isS ? 'Paid + discount' : 'Received + discount', inr(tLess))}</div>
       <div class="col-6 col-md-3">${stat(isS ? 'Closing payable' : 'Closing due', inr(bal), dShort(to), '', 'hero')}</div></div>`
    + `<a class="btn btn-light border w-100 mb-3 d-md-none" target="_blank" rel="noopener" href="https://wa.me/91${p.phone}?text=${encodeURIComponent(msg)}"><i class="bi bi-whatsapp text-success me-1"></i>Share summary on WhatsApp</a>`
    + dataView(cols, rows, {foot: true, emptyMsg: 'No transactions in this period.', emptyIcon: 'file-text'});
};

PAGES['pl-customer'] = () => {
  const {cpFrom: f, cpTo: t} = state.f, sm = stockMap();
  const daySales = {}, dayExp = {};
  DB.sales.filter(s => s.date >= f && s.date <= t).forEach(s => { daySales[s.date] = (daySales[s.date] || 0) + amtOf(s); });
  Object.keys(daySales).forEach(d => { dayExp[d] = sum(DB.expenses.filter(e => e.date === d), e => e.amount); });
  const rows = DB.customers.map(c => {
    const S = DB.sales.filter(s => s.partyId === c.id && s.date >= f && s.date <= t);
    const birds = sum(S, s => s.birds), kg = sum(S, netKg), sales = sum(S, amtOf);
    const cost = sum(S, s => s.birds * (sm[s.date]?.cpb || 0));
    const expShare = sum(S, s => daySales[s.date] ? dayExp[s.date] * amtOf(s) / daySales[s.date] : 0);
    const disc = sum(DB.journal.filter(j => j.type === 'out' && j.partyId === c.id && j.date >= f && j.date <= t), j => j.amount);
    const gross = sales - cost, net = gross - disc - expShare;
    return {c, birds, kg, sales, cost, gross, disc, expShare, net};
  }).filter(r => r.birds).sort((a, b) => b.net - a.net);
  const T = k => sum(rows, r => r[k]);
  const cols = [
    {h: 'Customer', card: 'title', v: r => `<a href="#" class="link" data-action="stmt" data-type="customer" data-id="${r.c.id}">${esc(r.c.name)}</a>`},
    {h: 'Kg', card: 'sub', tableOnly: true, v: r => `${num(r.birds, 0)} birds · ${num(r.kg, 0)} kg`, tf: `${num(T('birds'), 0)} birds · ${num(T('kg'), 0)} kg`},
    {h: 'Sales', end: 1, v: r => inr(r.sales), tf: inr(T('sales'))},
    {h: 'Cost', end: 1, v: r => inr(r.cost), tf: inr(T('cost'))},
    {h: 'Gross', end: 1, v: r => inr(r.gross), tf: inr(T('gross'))},
    {h: 'Discount', end: 1, v: r => r.disc ? '−' + inr(r.disc) : '—', tf: '−' + inr(T('disc'))},
    {h: 'Exp. share', end: 1, v: r => '−' + inr(r.expShare), tf: '−' + inr(T('expShare'))},
    {h: 'Net / kg', end: 1, v: r => inr(r.kg ? r.net / r.kg : 0, 2), tf: inr(T('kg') ? T('net') / T('kg') : 0, 2)},
    {h: 'Net profit', card: 'amount', end: 1, v: r => `<b class="${tone(r.net)}">${inr(r.net)}</b>`, tf: inr(T('net'))},
  ];
  const best = rows[0];
  return head('Customer-wise P&L', `${dShort(f)} – ${dShort(t)} · daily expenses split by each customer's share of that day's sales`)
    + rangeNav('cpFrom', 'cpTo')
    + `<div class="row g-2 mb-3">
       <div class="col-6 col-md-3">${stat('Customers', rows.length)}</div>
       <div class="col-6 col-md-3">${stat('Sales', inr(T('sales')))}</div>
       <div class="col-6 col-md-3">${stat('Net profit', inr(T('net')), '', '', 'hero')}</div>
       <div class="col-6 col-md-3">${stat('Most profitable', best ? esc(best.c.name.split(' ').slice(0, 2).join(' ')) : '—', best ? inr(best.net) : '')}</div></div>`
    + dataView(cols, rows, {foot: true, emptyMsg: 'No sales in this period.', emptyIcon: 'person-lines-fill'})
    + `<div class="note mt-3"><i class="bi bi-calculator me-1"></i><b>How it's calculated:</b> Cost = birds sold × that day's average cost per bird. Expense share = day's total daily expense × (customer's sale ÷ day's total sales). Net = Sales − Cost − Discount given − Expense share. Monthly expenses are not split here; they are deducted in Monthly P&L.</div>`;
};

/* ---------------- Form pages (jQuery Validation) ---------------- */
const R = l => `${l} <span class="text-danger">*</span>`;
const fld = (label, inner, col = 'col-12', help = '') => `<div class="${col}"><label class="form-label">${label}</label>${inner}${help ? `<div class="form-text">${help}</div>` : ''}</div>`;
const inp = (name, val = '', attrs = '') => `<input class="form-control" name="${name}" id="f-${name}" value="${esc(val)}" ${attrs}>`;
const sel = (name, opts, val = '', ph = '') => `<select class="form-select" name="${name}" id="f-${name}">${ph ? `<option value="">${ph}</option>` : ''}${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${v === val ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
const dateRule = () => isOwner() ? {required: true, notFuture: true} : {required: true, todayOnly: true};
const NUM = 'type="number" step="any" inputmode="decimal"';

/* Custom jQuery Validation methods */
$.validator.addMethod('notFuture', function (v, el) { return this.optional(el) || v <= TODAY; }, 'Date cannot be in the future.');
$.validator.addMethod('notFutureMonth', function (v, el) { return this.optional(el) || v <= monthOf(TODAY); }, 'Month cannot be in the future.');
$.validator.addMethod('todayOnly', function (v, el) { return this.optional(el) || v === TODAY; }, "Employees can enter only today's date.");
$.validator.addMethod('lteField', function (v, el, p) { const o = +$(p).val(); return this.optional(el) || !o || +v <= o; }, 'Second (net) weight cannot be more than first weight.');
$.validator.addMethod('mobileIN', function (v, el) { return this.optional(el) || /^[6-9]\d{9}$/.test(v); }, 'Enter a valid 10-digit mobile number.');
$.validator.addMethod('username', function (v, el) { return this.optional(el) || /^[a-z0-9_.]{3,20}$/i.test(v); }, 'Use 3–20 letters, numbers, dot or underscore.');
$.validator.addMethod('uniqueUser', function (v, el, id) { return this.optional(el) || !DB.users.some(u => u.username === v.trim().toLowerCase() && u.id !== id); }, 'This username is already taken.');
$.validator.setDefaults({
  errorElement: 'div', errorClass: 'invalid-feedback', ignore: ':hidden:not(.validate-hidden)',
  highlight: el => $(el).addClass('is-invalid'),
  unhighlight: el => $(el).removeClass('is-invalid'),
  errorPlacement: (err, el) => { const g = $(el).closest('.radio-group'); err.insertAfter(g.length ? g : el); },
});

/* Opens a form as its own page; returns to the page it was opened from */
function openForm(cfg) {
  state.formCfg = cfg;
  if (state.page !== 'form') state.formBack = state.page;
  go('form');
}
function closeForm() { state.formCfg = null; go(state.formBack || 'dashboard'); }

PAGES.form = () => {
  const c = state.formCfg, back = state.formBack;
  const backLabel = back === 'statement' ? 'Statement' : (NAV.find(n => n.id === back) || {label: 'Back'}).label;
  return `<div class="form-page">
    <a href="#" data-action="form-cancel" class="link small d-inline-block mb-2"><i class="bi bi-arrow-left"></i> ${backLabel}</a>
    ${head(c.title, c.sub || 'Fields marked <span class="text-danger">*</span> are required')}
    <form id="entryForm" novalidate autocomplete="off">
      <div class="cardx p-3 p-md-4">${c.body}</div>
      <div class="alert alert-danger mt-3 d-none" id="formErr"></div>
      <div class="form-actions">
        <button type="button" class="btn btn-light border" data-action="form-cancel">Cancel</button>
        <button type="submit" class="btn btn-brand px-4"><i class="bi bi-check2 me-1"></i>${c.save || 'Save'}</button>
      </div>
    </form></div>`;
};
function initForm() {
  const c = state.formCfg, form = qs('#entryForm');
  $(form).validate({
    rules: c.rules || {}, messages: c.messages || {},
    submitHandler: f => {
      const data = Object.fromEntries(new FormData(f));
      const err = c.onSave(data, f);
      if (err) { $('#formErr').text(err).removeClass('d-none'); return false; }
      closeForm(); return false;
    },
    invalidHandler: (e, v) => { if (v.errorList.length) setTimeout(() => v.errorList[0].element.scrollIntoView({block: 'center', behavior: 'smooth'}), 0); },
  });
  // re-check a field as soon as it is corrected, so errors clear while typing
  $(form).on('input change', 'input, select', function () { if (this.classList.contains('is-invalid')) $(this).valid(); });
  if (c.onInput) { $(form).on('input change', e => c.onInput(e, form)); c.onInput({target: {}}, form); }
}

      ${fld(R('Second weight (kg)'), inp('w2', r.w2, NUM + ' placeholder="0.00"'), 'col-6 col-md-4', 'This is the net weight – amount is calculated on it')}
      ${fld('Narration', `<textarea class="form-control" name="narration" id="f-narration" rows="2" maxlength="200" placeholder="e.g. Vehicle KL-10-AB-4521, evening load">${esc(r.narration || '')}</textarea>`)}
    </div>
    <div class="calc calc-4"><div><span>Net (2nd) weight</span><b id="cNet">—</b></div><div><span>Difference</span><b id="cDiff">—</b></div><div><span>Avg / bird</span><b id="cAvg">—</b></div><div><span>Amount</span><b id="cAmt">—</b></div></div>`,
    rules: {
      date: dateRule(), partyId: {required: true},
      birds: {required: true, digits: true, min: 1},
      rate: {required: true, number: true, min: 1, max: 1000},
      w1: {required: true, number: true, min: 0.01},
      w2: {required: true, number: true, min: 0.01, lteField: '#f-w1'},
      narration: {maxlength: 200},
    },
    messages: {
      date: {required: 'Select the date.'}, partyId: `Select a ${pt}.`,
      birds: {required: 'Enter the number of birds.', digits: 'Enter a whole number.', min: 'At least 1 bird.'},
      rate: {required: 'Enter the rate per kg.', min: 'Rate must be more than ₹0.', max: 'Rate looks too high.'},
      w1: {required: 'Enter the first weight.', min: 'Weight must be more than 0.'},
      w2: {required: 'Enter the second (net) weight.', min: 'Weight must be more than 0.'},
      narration: {maxlength: 'Keep narration under 200 characters.'},
    },
    onInput: (e, f) => {
      if (e.target.name === 'partyId' && !f.rate.value && f.partyId.value) {
        const last = arr.filter(x => x.partyId === f.partyId.value).sort((a, b) => b.date.localeCompare(a.date))[0];
        if (last) f.rate.value = last.rate;
      }
      if (e.target.name === 'w1' && f.w2.value) $('#f-w2').valid();
      const t = {w1: +f.w1.value || 0, w2: +f.w2.value || 0, rate: +f.rate.value || 0, birds: +f.birds.value || 0};
      const n = t.w2, ok = n > 0;
      qs('#cNet').textContent = ok ? num(n) + ' kg' : '—';
      qs('#cDiff').textContent = ok && t.w1 ? num(t.w1 - n) + ' kg' : '—';
      qs('#cAvg').textContent = ok && t.birds ? num(n / t.birds, 3) + ' kg' : '—';
      qs('#cAmt').textContent = ok && t.rate ? inr(Math.round(n * t.rate)) : '—';
    },
    onSave: d => {
      const rec = {date: d.date, partyId: d.partyId, birds: +d.birds, w1: +d.w1, w2: +d.w2, rate: +d.rate, narration: (d.narration || '').trim()};

      toast(`${isP ? 'Purchase' : 'Sale'} saved · ${num(netKg(rec))} kg · ${inr(amtOf(rec))}`);
    },
  });
}

/* ----- Supplier / Customer ----- */
function openParty(t, id) {
  const r = id ? partyList(t).find(x => x.id === id) : {name: '', phone: '', place: '', opening: 0};
  openForm({
    title: (id ? 'Edit ' : 'Add ') + t,
    body: `<div class="row g-3">${fld(R('Name'), inp('name', r.name, 'maxlength="60" placeholder="Business name"'))}${fld(R('Mobile'), inp('phone', r.phone, 'type="tel" inputmode="numeric" maxlength="10"'), 'col-6')}${fld('Place', inp('place', r.place, 'maxlength="40"'), 'col-6')}
      ${fld('Opening balance (₹)', inp('opening', r.opening, NUM), 'col-12 col-md-6', t === 'supplier' ? 'Amount we owed this supplier at start' : 'Amount this customer owed us at start')}</div>`,
    rules: {name: {required: true, minlength: 2, maxlength: 60}, phone: {required: true, mobileIN: true}, opening: {number: true}},
    messages: {name: {required: 'Enter the name.', minlength: 'Name is too short.'}, phone: {required: 'Enter the mobile number.'}, opening: 'Enter a valid amount.'},
    onSave: d => {
      const rec = {name: d.name.trim(), phone: d.phone, place: d.place, opening: +d.opening || 0};
      if (id) Object.assign(r, rec); else partyList(t).push({id: uid(), ...rec});
      toast(`${t === 'supplier' ? 'Supplier' : 'Customer'} saved`);
    },
  });
}

/* ----- User ----- */
function openUser(id) {
  const r = id ? DB.users.find(x => x.id === id) : {name: '', username: '', phone: '', role: 'employee', active: true};
  const self = id === state.user.id;
  openForm({
    title: id ? 'Edit user' : 'Add user',
    body: `<div class="row g-3">${fld(R('Full name'), inp('name', r.name, 'maxlength="50"'))}${fld(R('Username'), inp('username', r.username, 'autocapitalize="none" maxlength="20"'), 'col-6')}${fld(R('Mobile'), inp('phone', r.phone, 'type="tel" inputmode="numeric" maxlength="10"'), 'col-6')}
      ${fld(R('Role'), sel('role', [['employee', 'Employee – Purchase, Sales, Expense'], ['owner', 'Owner – full access']], r.role, ''), 'col-12 col-md-6')}
      ${fld(id ? 'New password' : R('Password'), inp('password', '', 'type="password" autocomplete="new-password"'), 'col-12 col-md-6', id ? 'Leave blank to keep the current password' : '')}
      ${fld(id ? 'Confirm new password' : R('Confirm password'), inp('password2', '', 'type="password" autocomplete="new-password"'), 'col-12 col-md-6')}
      <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="active" id="uActive" ${r.active ? 'checked' : ''} ${self ? 'disabled' : ''}><label class="form-check-label" for="uActive">Active (can log in)</label></div></div></div>`,
    rules: {
      name: {required: true, minlength: 2}, username: {required: true, username: true, uniqueUser: id || ''},
      phone: {required: true, mobileIN: true}, role: {required: true},
      password: {required: !id, minlength: 4}, password2: {required: () => !!$('#f-password').val(), equalTo: '#f-password'},
    },
    messages: {name: {required: 'Enter the full name.'}, username: {required: 'Enter a username.'}, phone: {required: 'Enter the mobile number.'},
      password: {required: 'Set a password.', minlength: 'Password must be at least 4 characters.'}, password2: {required: 'Re-enter the password.', equalTo: 'Passwords do not match.'}},
    onSave: d => {
      if (self && d.role !== 'owner') return 'You cannot remove your own owner role.';
      const rec = {name: d.name.trim(), username: d.username.trim().toLowerCase(), phone: d.phone, role: d.role, active: self ? true : !!d.active};
      if (d.password) rec.password = d.password;
      if (id) Object.assign(r, rec); else DB.users.push({id: uid(), ...rec});
      toast('User saved');
    },
  });
}

/* Delete */
const COLL = {purchase: 'purchases', sale: 'sales', expense: 'expenses', monthly: 'monthly', journal: 'journal', user: 'users'};
let pendingDel = null;
function askDelete(type, id) {
  pendingDel = {type, id};
  qs('#confirmText').textContent = type === 'user' ? 'This user will no longer be able to log in.' : 'This entry will be removed and reports will update.';
  bootstrap.Modal.getOrCreateInstance(qs('#confirmModal')).show();
}
qs('#confirmYes').addEventListener('click', () => {
  const k = COLL[pendingDel.type]; DB[k] = DB[k].filter(x => x.id !== pendingDel.id);
  bootstrap.Modal.getOrCreateInstance(qs('#confirmModal')).hide(); toast('Deleted'); render();
});

function toast(msg) { qs('#toastBody').textContent = msg; bootstrap.Toast.getOrCreateInstance(qs('#toast'), {delay: 2200}).show(); }

/* ---------------- Events ---------------- */
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); go(nav.dataset.nav); return; }
  const a = e.target.closest('[data-action]'); if (!a) return;
  const {action, type, id, key} = a.dataset;
  if (a.tagName === 'A') e.preventDefault();
  switch (action) {
    case 'demo-login': login(a.dataset.u, '1234'); break;
    case 'logout': state.user = null; render(); break;
    case 'switch-role': login(state.user.role === 'owner' ? 'salim' : 'rahath', '1234'); break;
    case 'more': bootstrap.Offcanvas.getOrCreateInstance(qs('#moreMenu')).show(); break;
    case 'day': state.f[key] = addDays(state.f[key], +a.dataset.n); if (state.f[key] > TODAY) state.f[key] = TODAY; render(); break;
    case 'today': state.f[key] = TODAY; render(); break;
    case 'new-purchase': openTxn('purchase'); break;
    case 'new-sale': openTxn('sale'); break;
    case 'new-expense': openExpense(); break;
    case 'new-monthly': openMonthly(); break;
    case 'new-journal': openJournal(); break;
    case 'new-user': openUser(); break;
    case 'new-party': openParty(type); break;
    case 'pay': openPayment(type || state.stmt?.type, id || state.stmt?.id); break;
    case 'stmt': state.stmt = {type, id, from: monthOf(TODAY) + '-01', to: TODAY}; go('statement'); break;
    case 'open-day': state.f.plDate = a.dataset.d; go('pl-daily'); break;
    case 'edit':
      ({purchase: () => openTxn('purchase', id), sale: () => openTxn('sale', id), expense: () => openExpense(id), monthly: () => openMonthly(id), journal: () => openJournal(id), user: () => openUser(id), supplier: () => openParty('supplier', id), customer: () => openParty('customer', id)})[type]();
      break;
    case 'del': askDelete(type, id); break;
    case 'form-cancel': closeForm(); break;
  }
});
document.addEventListener('change', e => {
  const k = e.target.dataset.filter;
  if (k && e.target.value) { state.f[k] = e.target.value > (e.target.type === 'month' ? monthOf(TODAY) : TODAY) ? (e.target.type === 'month' ? monthOf(TODAY) : TODAY) : e.target.value; render(); }
  const s = e.target.dataset.stmt;
  if (s && e.target.value) { state.stmt[s] = e.target.value; render(); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.search; if (!k) return;
  state.q[k] = e.target.value; const pos = e.target.selectionStart; render();
  const el = document.querySelector(`[data-search="${k}"]`); el.focus(); el.setSelectionRange(pos, pos);
});
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (state.user && h && h !== state.page && PAGES[h] && h !== 'form') { state.page = h; render(); window.scrollTo(0, 0); }
});
$('#loginForm').validate({
  rules: {u: {required: true}, p: {required: true, minlength: 4}},
  messages: {u: 'Enter your username.', p: {required: 'Enter your password.', minlength: 'Password must be at least 4 characters.'}},
  submitHandler: f => { login(f.u.value.trim().toLowerCase(), f.p.value); return false; },
});
function login(u, p) {
  const user = DB.users.find(x => x.username === u);
  if (!user || user.password !== p) { qs('#loginErr').textContent = 'Wrong username or password.'; return; }
  if (!user.active) { qs('#loginErr').textContent = 'This user is disabled. Contact the owner.'; return; }
  qs('#loginErr').textContent = ''; state.user = user;
  const h = location.hash.slice(1);
  state.page = PAGES[h] && !['statement', 'form'].includes(h) ? h : (user.role === 'owner' ? 'dashboard' : 'sales');
  render(); window.scrollTo(0, 0);
  toast(`Welcome, ${user.name.split(' ')[0]} (${user.role})`);
}

document.querySelectorAll('img[data-logo]').forEach(i => i.src = LOGO);
seed();
render();
</script>
</body>
</html>
